name: scan-crypto-opportunities

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: scan
        type: choice
        options: [scan, digest, recover-alert-log]
  schedule:
    - cron: "17 1,7,13,19 * * *"
    - cron: "23 7,8 * * *"

permissions:
  contents: write

concurrency:
  group: crypto-opportunity-scanner-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 1,7,13,19 * * *" ]; then
            echo "mode=scan" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            BELGRADE_HOUR="$(TZ=Europe/Belgrade date '+%H')"
            echo "mode=digest" >> "$GITHUB_OUTPUT"
            if [ "$BELGRADE_HOUR" = "09" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping duplicate DST digest slot; Belgrade hour is $BELGRADE_HOUR"
            fi
          fi

      - name: Run scanner
        if: steps.mode.outputs.should_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          GALXE_ACCESS_TOKEN: ${{ secrets.GALXE_ACCESS_TOKEN }}
          GALXE_SPACE_ALIASES: ${{ vars.GALXE_SPACE_ALIASES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_SCORE: "55"
          IMMEDIATE_REWARD_USD: "20"
          URGENT_HOURS: "48"
          DIGEST_HOUR: "9"
          TIMEZONE: Europe/Belgrade
          STATE_PATH: data/state.json
          ALERT_LOG_PATH: data/alerts.jsonl
        run: opportunity-scanner "${{ steps.mode.outputs.mode }}"

      - name: Commit persistent data changes
        if: steps.mode.outputs.should_run == 'true'
        run: |
          if [ -z "$(git status --porcelain -- data/state.json data/alerts.jsonl)" ]; then
            echo "No persistent data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/alerts.jsonl
          git commit -m "chore: update scanner data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
